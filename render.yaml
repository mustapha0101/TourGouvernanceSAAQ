databases:
  - name: saaq-initiatives-db
    databaseName: saaq_initiatives_db
    user: saaquser
    plan: free

services:
  - type: web
    name: playbook-agent-saaq
    env: node
    plan: free
    buildCommand: npm install && (python3 -m pip install -r requirements.txt || pip3 install -r requirements.txt || true)
    startCommand: node server.js
    envVars:
      - key: APP_USER
        value: demo
      - key: APP_PASSWORD
        value: Gouvernance2026!
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: saaq-initiatives-db
          property: connectionString
