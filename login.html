<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1329;
      background-image: radial-gradient(circle at 50% 40%, #1e293b 0%, #0b1329 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 18px;
      padding: 36px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    .lock-icon {
      font-size: 32px;
      margin-bottom: 24px;
      display: inline-block;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-input {
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-input:focus {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 1);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .form-input::placeholder {
      color: #64748b;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45);
    }

    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="lock-icon">🔒</div>

    <div id="error-msg" class="error-msg">
      Identifiant ou mot de passe incorrect.
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <input type="text" id="username" class="form-input" placeholder="Identifiant" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <input type="password" id="password" class="form-input" placeholder="Mot de passe" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="btn-submit">
        Connexion
      </button>
    </form>
  </div>

  <script>

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');
      const err = document.getElementById('error-msg');
      const urlParams = new URLSearchParams(window.location.search);
      const targetUrl = urlParams.get('redirect') || '/';

      err.style.display = 'none';
      btn.innerText = 'Connexion...';
      btn.style.opacity = '0.7';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });

        if (response.ok) {
          window.location.href = targetUrl;
          return;
        } else {
          showError('Identifiant ou mot de passe incorrect.');
        }
      } catch (networkErr) {
        showError('Erreur de communication avec le serveur.');
      }
    }

    function showError(msg) {
      const btn = document.getElementById('btn-submit');
      const err = document.getElementById('error-msg');
      if (msg) err.innerText = msg;
      err.style.display = 'block';
      btn.innerText = 'Connexion';
      btn.style.opacity = '1';
    }
  </script>
</body>
</html>
